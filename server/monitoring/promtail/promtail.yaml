# Promtail: reads every container's logs from Docker and sends them to Loki, labelled by compose service. The
# microservices' lines ("[time] auth-service.WARN: …") also get a `level` label.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["com.docker.compose.project=server"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: project
    pipeline_stages:
      - regex:
          expression: '^\[(?P<time>[^\]]+)\] [\w-]+\.(?P<level>[A-Z]+): '
      - labels:
          level:
      - template:
          source: level
          template: '{{ ToLower .Value }}'
      - labels:
          level:
