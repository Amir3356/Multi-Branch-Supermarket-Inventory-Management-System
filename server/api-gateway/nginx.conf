# SuperMart IMS API gateway (nginx): the one public entry point, on http://localhost:8000.
#
# Installed as /etc/nginx/templates/default.conf.template: on start the nginx image fills in ${INTERNAL_SERVICE_SECRET}
# from the environment (api-gateway/.env). nginx's own $variables are left alone.
#
# For every /api request it:
#   1. strips any internal headers a browser sent, so nobody can pretend to be another user or a service
#   2. asks auth-service who the bearer token belongs to (auth_request → GET /internal/auth/gateway-check) and forwards
#      the answer as x-auth-context; guests pass too, and each service decides whether a route needs sign-in
#   3. sends it to the owning service with /api removed: GET /api/sales → sales-service GET /sales

# Which service owns each part of the public API (first match wins)
map $uri $api_service {
    ~^/api/(auth|sessions)(/|$)                       auth-service:4001;
    ~^/api/(accounts|invitations|access-reviews)(/|$) user-service:4002;
    ~^/api/(branches|policy)(/|$)                     branch-service:4003;
    ~^/api/(products|stock|transfers|damaged-items)(/|$) inventory-service:4004;
    ~^/api/(sales|expenses)(/|$)                      sales-service:4005;
    ~^/api/procurements(/|$)                          procurement-service:4006;
    ~^/api/(reports|dashboard|audit-logs)(/|$)        reporting-service:4007;
    ~^/api/ai(/|$)                                    ai-service:4008;
    default                                           "";
}

# WebSocket upgrades for Socket.IO; plain requests keep the connection reusable
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8000;
    server_name _;

    client_max_body_size 20M;

    # Docker's DNS: service names are looked up again every 10s, so a restarted container (new IP) is found
    resolver 127.0.0.11 valid=10s ipv6=off;

    default_type application/json;

    location = /health {
        return 200 '{"status":"ok","gateway":"nginx"}';
    }

    # Service-to-service endpoints are never reachable from outside
    location ^~ /internal {
        return 404 '{"message":"Not found."}';
    }
    location ^~ /api/internal {
        return 404 '{"message":"Not found."}';
    }

    # Every public API route
    location /api/ {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, Idempotency-Key, idempotency-key" always;
        add_header Access-Control-Expose-Headers "Idempotent-Replayed" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With, Idempotency-Key, idempotency-key" always;
            add_header Access-Control-Expose-Headers "Idempotent-Replayed" always;
            add_header Access-Control-Max-Age 86400;
            return 204;
        }
        if ($api_service = "") {
            return 404 '{"message":"The route could not be found."}';
        }

        auth_request /_gateway_auth;
        auth_request_set $auth_context $upstream_http_x_auth_context;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header x-internal-secret "${INTERNAL_SERVICE_SECRET}";
        proxy_set_header x-client-ip $remote_addr;
        # Empty for guests, so a browser-sent x-auth-context never gets through
        proxy_set_header x-auth-context $auth_context;

        # AI answers can take as long as the model's own timeout
        proxy_read_timeout 90s;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_service;
    }

    # auth_request target: who the bearer token belongs to (always 204; x-auth-context set when signed in)
    location = /_gateway_auth {
        internal;
        set $auth_service auth-service:4001;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header x-internal-secret "${INTERNAL_SERVICE_SECRET}";
        proxy_set_header x-auth-context "";
        proxy_set_header x-client-ip $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://$auth_service/internal/auth/gateway-check;
    }

    # Live updates: Socket.IO polling and WebSockets → notification-service, which checks the token itself
    location /socket.io {
        set $notification_service notification-service:4009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header x-internal-secret "${INTERNAL_SERVICE_SECRET}";
        proxy_set_header x-client-ip $remote_addr;
        proxy_read_timeout 86400s;
        proxy_pass http://$notification_service;
    }

    location / {
        return 404 '{"message":"Not found."}';
    }

    # A service (or the sign-in check) that is down answers in the client's error shape
    error_page 500 502 503 504 = @service_unavailable;
    location @service_unavailable {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        return 503 '{"message":"Service is temporarily unavailable. Please try again shortly."}';
    }
}
