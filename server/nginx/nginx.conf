    }

    # Realtime Live Updates & WebSockets -> notification-service (:4009)
    location /socket.io {
        proxy_pass http://notification_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Catch-all for unmapped /api routes
    location /api {
        default_type application/json;
        return 404 '{"message":"The route could not be found."}';
    }

    # Graceful JSON Error responses for down services
    error_page 502 503 504 = @service_unavailable;
    location @service_unavailable {
        default_type application/json;
        return 502 '{"message":"Service is temporarily unavailable. Please try again shortly."}';
    }
}
