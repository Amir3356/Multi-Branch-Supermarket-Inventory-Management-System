# Nginx API Gateway for Local Development
# Listens on http://localhost:8000 and routes to backend microservices

upstream auth_service {
    server 127.0.0.1:4001;
    keepalive 32;
}

upstream user_service {
    server 127.0.0.1:4002;
    keepalive 32;
}

upstream branch_service {
    server 127.0.0.1:4003;
    keepalive 32;
}

upstream inventory_service {
    server 127.0.0.1:4004;
    keepalive 32;
}

upstream sales_service {
    server 127.0.0.1:4005;
    keepalive 32;
}

upstream procurement_service {
    server 127.0.0.1:4006;
    keepalive 32;
}

upstream reporting_service {
    server 127.0.0.1:4007;
    keepalive 32;
}

upstream ai_service {
    server 127.0.0.1:4008;
    keepalive 32;
}

upstream notification_service {
    server 127.0.0.1:4009;
    keepalive 32;
}

server {
    listen 8000;
    server_name localhost;

    client_max_body_size 20M;

    # Common Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-internal-secret "dev-internal-secret";
    proxy_set_header x-client-ip $remote_addr;
    proxy_set_header Authorization $http_authorization;

    # CORS Headers for Local Development
    add_header "Access-Control-Allow-Origin" "$http_origin" always;
    add_header "Access-Control-Allow-Credentials" "true" always;
    add_header "Access-Control-Allow-Methods" "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header "Access-Control-Allow-Headers" "Authorization, Content-Type, Accept, Origin, X-Requested-With, Idempotency-Key, idempotency-key, x-internal-secret" always;

    # Gateway Health Check
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx"}';
    }

    # Block direct access to internal endpoints
    location ^~ /internal {
        default_type application/json;
        return 404 '{"message":"Not found."}';
    }
    location ^~ /api/internal {
        default_type application/json;
        return 404 '{"message":"Not found."}';
    }

    # =========================================================================
    # Routes (Strips /api prefix before forwarding to downstream services)
    # =========================================================================

    # Auth & Sessions -> auth-service (:4001)
    location /api/auth {
        if ($request_method = "OPTIONS") {
            add_header "Access-Control-Allow-Origin" "$http_origin" always;
            add_header "Access-Control-Allow-Credentials" "true" always;
            add_header "Access-Control-Allow-Methods" "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header "Access-Control-Allow-Headers" "Authorization, Content-Type, Accept, Origin, X-Requested-With, Idempotency-Key, idempotency-key, x-internal-secret" always;
            add_header "Access-Control-Max-Age" 86400;
            return 204;
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://auth_service;
    }
    location /api/sessions {
        if ($request_method = "OPTIONS") {
            add_header "Access-Control-Allow-Origin" "$http_origin" always;
            add_header "Access-Control-Allow-Credentials" "true" always;
